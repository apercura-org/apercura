# Local development services.
#   docker compose -f docker/compose.yml up -d
# Ports: POSTGRES_PORT, MINIO_PORT and MINIO_CONSOLE_PORT move the host side. Every port is
# published on 127.0.0.1 only: these services use well-known development passwords.
name: apercura

services:
  postgres:
    image: postgis/postgis:17-3.7
    # The official PostGIS image is published for amd64 only; Apple Silicon runs it emulated.
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apercura
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apercura"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  # S3-compatible storage for practitioner photos and (encrypted) claim
  # documents. MinIO's own images are no longer published; this is the
  # community build of the same server (AGPL-3.0). The app creates the bucket
  # on first use. Production uses the host's S3 (e.g. Cellar).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: apercura
      MINIO_ROOT_PASSWORD: apercura-dev-only
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
