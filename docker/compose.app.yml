# Apercura's application stack, without its data services. See docs/self-hosting.md.
#
# Services: migrate (one-shot), app (one replica), valkey (the app's page cache, in memory,
# bounded), scheduler (supercronic: jobs and the cache warm-up every 5 minutes, weekly import),
# etl (profile `tools`, on demand), minio-init (one-shot bucket bootstrap).
#
# PostgreSQL (17 + PostGIS) and the S3 storage run elsewhere and outlive every deploy of this
# file: docker/compose.selfhost.yml includes it next to its own postgres and minio services,
# and Coolify deploys it alone (base directory /docker) against a PostgreSQL resource and a
# MinIO resource (docs/deploy-vps.md, "Under Coolify"). Where they are:
#
#   APERCURA_DB_HOST, APERCURA_DB_PORT, APERCURA_DB_NAME   default postgres, 5432, apercura
#   DATABASE_URL_MIGRATE                                   superuser URL; default built from
#                                                          POSTGRES_PASSWORD (user postgres)
#   S3_ENDPOINT                                            default http://minio:9000
#
# Nothing here depends on a database or storage service: `migrate` waits until the database
# accepts connections (DATABASE_WAIT_SECONDS, default 120), `minio-init` until the S3 endpoint
# answers, and the app starts once both have succeeded and valkey answers.
#
# Kept within what Coolify reads: only ${VAR}, ${VAR:-default} and ${VAR:?message}, no
# single-file bind mount, no empty `command`, paths relative to this directory.

# One image for the app, the scheduler, the import and the migrations. APP_URL is baked into
# static pages at build time: rebuild (`up -d --build`) when it changes.
x-image: &image
  image: ${APERCURA_IMAGE:-apercura:local}
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      APP_URL: ${APP_URL:?set APP_URL}
      PUBLIC_HDS_HOST: ${PUBLIC_HDS_HOST:-}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
      LEGAL_PUBLISHER_NAME: ${LEGAL_PUBLISHER_NAME:-}
      LEGAL_PUBLISHER_LEGAL_FORM: ${LEGAL_PUBLISHER_LEGAL_FORM:-}
      LEGAL_PUBLISHER_ADDRESS: ${LEGAL_PUBLISHER_ADDRESS:-}
      LEGAL_PUBLISHER_PHONE: ${LEGAL_PUBLISHER_PHONE:-}
      LEGAL_PUBLISHER_REGISTRATION: ${LEGAL_PUBLISHER_REGISTRATION:-}
      LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR:-}
      LEGAL_PUBLISHER_VAT_ID: ${LEGAL_PUBLISHER_VAT_ID:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_DPO_CONTACT: ${LEGAL_DPO_CONTACT:-}
      LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-}
      LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS:-}
      LEGAL_HOST_PHONE: ${LEGAL_HOST_PHONE:-}
      LEGAL_SMTP_PROVIDER: ${LEGAL_SMTP_PROVIDER:-}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-}

# Where the database is; the image's entry point builds DATABASE_URL_JOBS and, for `migrate`,
# DATABASE_URL_MIGRATE from these.
x-db-address: &db-address
  APERCURA_DB_HOST: ${APERCURA_DB_HOST:-postgres}
  APERCURA_DB_PORT: ${APERCURA_DB_PORT:-5432}
  APERCURA_DB_NAME: ${APERCURA_DB_NAME:-apercura}

# The web app's variables, shared by the app and the scheduler (docs/configuration.md).
x-app-env: &app-env
  APP_URL: ${APP_URL}
  DATABASE_URL: postgres://apercura_app:${APERCURA_APP_DB_PASSWORD:?set APERCURA_APP_DB_PASSWORD}@${APERCURA_DB_HOST:-postgres}:${APERCURA_DB_PORT:-5432}/${APERCURA_DB_NAME:-apercura}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run `bun run keys:generate` and set BETTER_AUTH_SECRET}
  PSC_CLIENT_ID: ${PSC_CLIENT_ID:-}
  PSC_CLIENT_SECRET: ${PSC_CLIENT_SECRET:-}
  PSC_ISSUER: ${PSC_ISSUER:-}
  ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS (bun run keys:generate)}
  ENCRYPTION_ACTIVE_KEY: ${ENCRYPTION_ACTIVE_KEY:?set ENCRYPTION_ACTIVE_KEY}
  BLIND_INDEX_KEY: ${BLIND_INDEX_KEY:?set BLIND_INDEX_KEY (bun run keys:generate)}
  ALTCHA_HMAC_KEY: ${ALTCHA_HMAC_KEY:?set ALTCHA_HMAC_KEY (bun run keys:generate)}
  RATE_LIMIT_KEY: ${RATE_LIMIT_KEY:?set RATE_LIMIT_KEY (bun run keys:generate)}
  SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
  # Production requires TLS (smtps://, or smtp:// with STARTTLS); `true` only for Mailpit.
  SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
  MAIL_FROM: ${MAIL_FROM:-Apercura <no-reply@localhost>}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-apercura}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-apercura-app}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
  S3_REGION: ${S3_REGION:-us-east-1}
  JOBS_SECRET: ${JOBS_SECRET:-}
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set REVALIDATE_SECRET (bun run keys:generate)}
  TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
  CANONICAL_HOST_REDIRECT: ${CANONICAL_HOST_REDIRECT:-true}
  # Former hosts whose every URL redirects to APP_URL (e.g. apercura.fr,www.apercura.fr).
  LEGACY_HOSTS: ${LEGACY_HOSTS:-}
  # The page cache (docs/self-hosting.md, "Page cache"): the valkey service below. Its
  # password, if set, in letters and digits only.
  CACHE_REDIS_URL: ${CACHE_REDIS_URL:-redis://valkey:6379}
  CACHE_REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD:-}
  PUBLIC_HDS_HOST: ${PUBLIC_HDS_HOST:-}
  FEATURE_BOOKING: ${FEATURE_BOOKING:-false}
  FEATURE_CLAIM_DOCUMENTS: ${FEATURE_CLAIM_DOCUMENTS:-true}
  AUDIT_LOG_RETENTION_MONTHS: ${AUDIT_LOG_RETENTION_MONTHS:-12}
  REPORT_RETENTION_MONTHS: ${REPORT_RETENTION_MONTHS:-6}
  REMOVAL_REQUEST_RETENTION_MONTHS: ${REMOVAL_REQUEST_RETENTION_MONTHS:-12}
  CONTACT_REQUEST_RETENTION_MONTHS: ${CONTACT_REQUEST_RETENTION_MONTHS:-12}
  PAGE_VIEW_RETENTION_MONTHS: ${PAGE_VIEW_RETENTION_MONTHS:-13}
  # Administrators' alerts (claims, contact requests); default LEGAL_CONTACT_EMAIL.
  ADMIN_NOTIFY_EMAIL: ${ADMIN_NOTIFY_EMAIL:-}
  ADMIN_ALERT_INTERVAL_MINUTES: ${ADMIN_ALERT_INTERVAL_MINUTES:-15}
  # Publisher and host of the legal pages: required in production (docs/configuration.md).
  LEGAL_PUBLISHER_NAME: ${LEGAL_PUBLISHER_NAME:-}
  LEGAL_PUBLISHER_LEGAL_FORM: ${LEGAL_PUBLISHER_LEGAL_FORM:-}
  LEGAL_PUBLISHER_ADDRESS: ${LEGAL_PUBLISHER_ADDRESS:-}
  LEGAL_PUBLISHER_PHONE: ${LEGAL_PUBLISHER_PHONE:-}
  LEGAL_PUBLISHER_REGISTRATION: ${LEGAL_PUBLISHER_REGISTRATION:-}
  LEGAL_PUBLICATION_DIRECTOR: ${LEGAL_PUBLICATION_DIRECTOR:-}
  LEGAL_PUBLISHER_VAT_ID: ${LEGAL_PUBLISHER_VAT_ID:-}
  LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
  LEGAL_DPO_CONTACT: ${LEGAL_DPO_CONTACT:-}
  LEGAL_HOST_NAME: ${LEGAL_HOST_NAME:-}
  LEGAL_HOST_ADDRESS: ${LEGAL_HOST_ADDRESS:-}
  LEGAL_HOST_PHONE: ${LEGAL_HOST_PHONE:-}
  LEGAL_SMTP_PROVIDER: ${LEGAL_SMTP_PROVIDER:-}
  LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
  SECURITY_CONTACT: ${SECURITY_CONTACT:-}
  SECURITY_POLICY_URL: ${SECURITY_POLICY_URL:-}
  GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
  BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}

# The import's own role: `directory` only, no access to patient data.
x-etl-env: &etl-env
  DATABASE_URL_ETL: postgres://apercura_etl:${APERCURA_ETL_DB_PASSWORD:?set APERCURA_ETL_DB_PASSWORD}@${APERCURA_DB_HOST:-postgres}:${APERCURA_DB_PORT:-5432}/${APERCURA_DB_NAME:-apercura}
  # Where the import sends its cache tags, inside the stack's network.
  INTERNAL_APP_URL: ${INTERNAL_APP_URL:-http://app:3000}
  ETL_PROFESSIONS: ${ETL_PROFESSIONS:-10,40,50,60}

services:
  # Waits for the database, applies pending migrations, then the roles' passwords below (LOGIN
  # PASSWORD; an empty one leaves its role as is), then exits. On a new database the migrations
  # create the four roles without login and this step gives them theirs: no init script needed.
  # Runs on every `up`: changing a password here and redeploying rotates it.
  migrate:
    <<: *image
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    environment:
      <<: *db-address
      # Explicit superuser URL (an external database), or empty: built from POSTGRES_PASSWORD
      # for the `postgres` user at APERCURA_DB_HOST.
      DATABASE_URL_MIGRATE: ${DATABASE_URL_MIGRATE:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      DATABASE_WAIT_SECONDS: ${DATABASE_WAIT_SECONDS:-120}
      APERCURA_APP_DB_PASSWORD: ${APERCURA_APP_DB_PASSWORD:-}
      APERCURA_ETL_DB_PASSWORD: ${APERCURA_ETL_DB_PASSWORD:-}
      APERCURA_READONLY_DB_PASSWORD: ${APERCURA_READONLY_DB_PASSWORD:-}
      APERCURA_JOBS_DB_PASSWORD: ${APERCURA_JOBS_DB_PASSWORD:-}

  app:
    <<: *image
    command: ["serve"]
    restart: unless-stopped
    # One replica (see docs/self-hosting.md, "Page cache"). Pages are cached in valkey.
    environment: *app-env
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - next-cache:/app/apps/web/.next/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  # The app's page cache: rendered pages and cached queries, in memory only, at most
  # CACHE_MAX_MEMORY (default 1gb), the least recently used evicted first. Nothing is saved
  # (no RDB, no AOF): a restart starts empty and the warm-up fills it again. Not published:
  # only the app reaches it, on the stack's network. The container's memory limit,
  # CACHE_MEM_LIMIT (default 1280m), must stay above CACHE_MAX_MEMORY (about a quarter more,
  # for Valkey's own overhead). BSD-licensed Valkey, pinned.
  valkey:
    image: valkey/valkey:8.1.12-alpine
    restart: unless-stopped
    environment:
      CACHE_MAX_MEMORY: ${CACHE_MAX_MEMORY:-1gb}
      CACHE_REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD:-}
    # The image's entry point again, so the server drops root as usual; a password only when
    # one is set.
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$$CACHE_REDIS_PASSWORD" ]; then
          set -- --requirepass "$$CACHE_REDIS_PASSWORD"
        fi
        exec docker-entrypoint.sh valkey-server --maxmemory "$$CACHE_MAX_MEMORY" --maxmemory-policy allkeys-lru --save "" --appendonly no "$$@"
    mem_limit: ${CACHE_MEM_LIMIT:-1280m}
    # The image's /data volume, unused without persistence: no volume left behind per deploy.
    tmpfs:
      - /data
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$$CACHE_REDIS_PASSWORD" ]; then export REDISCLI_AUTH="$$CACHE_REDIS_PASSWORD"; fi; valkey-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  scheduler:
    <<: *image
    command: ["scheduler"]
    restart: unless-stopped
    healthcheck:
      disable: true
    environment:
      <<: [*app-env, *etl-env, *db-address]
      ETL_SCHEDULE_ARGS: ${ETL_SCHEDULE_ARGS:-}
      ETL_AT_SCHEDULE_ARGS: ${ETL_AT_SCHEDULE_ARGS:-}
      ETL_GB_SCHEDULE_ARGS: ${ETL_GB_SCHEDULE_ARGS:-}
      ETL_CZ_SCHEDULE_ARGS: ${ETL_CZ_SCHEDULE_ARGS:-}
      ETL_ES_SCHEDULE_ARGS: ${ETL_ES_SCHEDULE_ARGS:-}
      ETL_IT_SCHEDULE_ARGS: ${ETL_IT_SCHEDULE_ARGS:-}
      ETL_DE_SCHEDULE_ARGS: ${ETL_DE_SCHEDULE_ARGS:-}
      ETL_CH_SCHEDULE_ARGS: ${ETL_CH_SCHEDULE_ARGS:-}
      ETL_EE_SCHEDULE_ARGS: ${ETL_EE_SCHEDULE_ARGS:-}
      ETL_PL_SCHEDULE_ARGS: ${ETL_PL_SCHEDULE_ARGS:-}
      ETL_NO_SCHEDULE_ARGS: ${ETL_NO_SCHEDULE_ARGS:-}
      ETL_IE_SCHEDULE_ARGS: ${ETL_IE_SCHEDULE_ARGS:-}
      ETL_FI_SCHEDULE_ARGS: ${ETL_FI_SCHEDULE_ARGS:-}
      ETL_LT_SCHEDULE_ARGS: ${ETL_LT_SCHEDULE_ARGS:-}
      ETL_SI_SCHEDULE_ARGS: ${ETL_SI_SCHEDULE_ARGS:-}
      ETL_CY_SCHEDULE_ARGS: ${ETL_CY_SCHEDULE_ARGS:-}
      ETL_LV_SCHEDULE_ARGS: ${ETL_LV_SCHEDULE_ARGS:-}
      # Cache warm-up (`jobs:tick warm`, docs/self-hosting.md): requests INTERNAL_APP_URL as
      # APP_URL's host, a budget at a time; `false` turns it off.
      WARM_CACHE: ${WARM_CACHE:-true}
      WARM_CACHE_CONCURRENCY: ${WARM_CACHE_CONCURRENCY:-4}
      WARM_CACHE_MAX_URLS: ${WARM_CACHE_MAX_URLS:-5000}
      WARM_CACHE_MAX_SECONDS: ${WARM_CACHE_MAX_SECONDS:-240}
      WARM_CACHE_MAX_P95_MS: ${WARM_CACHE_MAX_P95_MS:-3000}
      # URLs warmed per walk, at most: by default what half of CACHE_MAX_MEMORY holds (16384
      # for 1gb), the highest-value pages first; 0 walks every sitemap URL.
      WARM_CACHE_BUDGET_URLS: ${WARM_CACHE_BUDGET_URLS:-}
      CACHE_MAX_MEMORY: ${CACHE_MAX_MEMORY:-1gb}
      # The audit log retention's own role (packages/db/drizzle/0016): the entry point builds
      # DATABASE_URL_JOBS from the password unless a URL is given; both empty: skipped.
      APERCURA_JOBS_DB_PASSWORD: ${APERCURA_JOBS_DB_PASSWORD:-}
      DATABASE_URL_JOBS: ${DATABASE_URL_JOBS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # On demand: docker compose … run --rm etl --department 75
  # (Austria: docker compose … run --rm --entrypoint "apercura etl:at" etl;
  #  the UK: docker compose … run --rm --entrypoint "apercura etl:gb" etl)
  etl:
    <<: *image
    entrypoint: ["apercura", "etl:fr"]
    restart: "no"
    profiles: [tools]
    healthcheck:
      disable: true
    environment:
      <<: *etl-env
      APP_URL: ${APP_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Bucket bootstrap. With the MinIO administrator (MINIO_ROOT_PASSWORD set): waits for the S3
  # endpoint, then creates the private bucket and the app's own access key, limited to that
  # bucket, on every `up` (a changed S3_SECRET_ACCESS_KEY is applied). Without it (any other
  # S3, or a key created by hand): nothing to do, the bucket and the key are managed at the
  # provider and the app creates the bucket on first use if its key may. The administrator's
  # credentials only ever reach this container, never the app.
  minio-init:
    image: pgsty/mc:RELEASE.2026-11-12T00-00-00Z
    restart: "no"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-apercura-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-apercura}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-apercura-app}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -z "$$MINIO_ROOT_PASSWORD" ]; then
          echo "No MINIO_ROOT_PASSWORD: bucket $$S3_BUCKET and key $$S3_ACCESS_KEY_ID are managed at the S3 provider"
          exit 0
        fi
        # Up to 120 s for the endpoint (mc checks the credentials too).
        tries=0
        until out=$$(mc alias set local "$$S3_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" 2>&1); do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 60 ]; then
            echo "S3 endpoint $$S3_ENDPOINT still unusable after 120 s: $$out" >&2
            exit 1
          fi
          [ "$$tries" -eq 1 ] && echo "Waiting for the S3 endpoint $$S3_ENDPOINT"
          sleep 2
        done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
        cat > /tmp/apercura-app.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            { "Effect": "Allow", "Action": ["s3:GetBucketLocation", "s3:ListBucket"], "Resource": ["arn:aws:s3:::$$S3_BUCKET"] },
            { "Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"], "Resource": ["arn:aws:s3:::$$S3_BUCKET/*"] }
          ]
        }
        EOF
        mc admin policy create local apercura-app /tmp/apercura-app.json >/dev/null
        mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null
        mc admin policy attach local apercura-app --user "$$S3_ACCESS_KEY_ID" >/dev/null 2>&1 || true
        echo "Bucket $$S3_BUCKET ready"

volumes:
  next-cache:
