name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The page cache handlers' integration tests (apps/web/cache-handler) run against it.
    services:
      valkey:
        image: valkey/valkey:8.1.12-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Known vulnerabilities: none at all in what production runs, none high or critical in
      # the development tools.
      - name: Dependency audit
        run: |
          bun audit --prod
          bun audit --audit-level=high
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
        env:
          CACHE_REDIS_URL_TEST: redis://localhost:6379
      - run: bun run build
        env:
          SKIP_ENV_VALIDATION: "1"

  # The Playwright suite in parallel shards (`--shard=i/N`, e2e/shard-reporter.ts deals the
  # sitemap's parts across them), and Lighthouse CI on a runner of its own (#191). Each one sets
  # up its own database with every market's fixtures (the sitemap lists every market), builds
  # the app and starts its own server: on one runner the suite outgrew its 25 minutes. To add a
  # shard, add "i/N" below and renumber the others. The check to require is the
  # "End-to-end and accessibility (Playwright + axe)" job after this one.
  e2e-shards:
    name: "End-to-end and accessibility (${{ matrix.run == 'lighthouse' && 'Lighthouse CI' || format('shard {0}', matrix.run) }})"
    runs-on: ubuntu-latest
    # A shard takes about 9 minutes, Lighthouse CI about 7.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: ["1/4", "2/4", "3/4", "4/4", lighthouse]
    # The public pages read the directory: a throwaway PostGIS seeded with the
    # SYNTHETIC fixtures (never real registry data, never production).
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apercura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apercura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Receives the sign-up, claim and removal emails; the tests read them from its API.
      mailpit:
        image: axllent/mailpit:v1.34.0
        ports:
          - 1025:1025
          - 8025:8025
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/apercura
      SMTP_URL: smtp://localhost:1025
      # Mailpit offers no STARTTLS; production requires TLS otherwise (docs/configuration.md).
      SMTP_ALLOW_INSECURE: "true"
      MAIL_FROM: "Apercura <no-reply@localhost>"
      MAILPIT_URL: http://localhost:8025
      # Test-only secret: the CI database is thrown away after the job.
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3100
      # Claim documents and photos: a throwaway MinIO started below.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: apercura
      S3_ACCESS_KEY_ID: apercura
      S3_SECRET_ACCESS_KEY: apercura-ci-only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # A service container cannot be given a command, and MinIO needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z server /data
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio
          exit 1
      # Fresh, throwaway encryption keys for this job (claim documents, reports).
      - name: Generate test encryption keys
        run: |
          echo "ENCRYPTION_KEYS=ci:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_ACTIVE_KEY=ci" >> "$GITHUB_ENV"
      - name: Apply migrations
        run: bun run db:migrate
      - name: Import the synthetic fixtures
        run: bun run etl:fr --source-dir packages/etl/fixtures/fr --offline
      - name: Import the synthetic Austrian fixtures
        run: bun run etl:at --source-dir packages/etl/fixtures/at --offline
      - name: Import the synthetic UK fixtures
        run: bun run etl:gb --source-dir packages/etl/fixtures/gb --offline
      - name: Import the synthetic Czech fixtures
        run: bun run etl:cz --source-dir packages/etl/fixtures/cz --offline
      - name: Import the synthetic Spanish fixtures
        run: bun run etl:es --source-dir packages/etl/fixtures/es --offline
      - name: Import the synthetic Italian fixtures
        run: bun run etl:it --source-dir packages/etl/fixtures/it --offline
      - name: Import the synthetic German fixtures
        run: bun run etl:de --source-dir packages/etl/fixtures/de --offline
      - name: Import the synthetic Swiss fixtures
        run: bun run etl:ch --source-dir packages/etl/fixtures/ch --offline
      - name: Import the synthetic Estonian fixtures
        run: bun run etl:ee --source-dir packages/etl/fixtures/ee --offline
      - name: Import the synthetic Polish fixtures
        run: bun run etl:pl --source-dir packages/etl/fixtures/pl --offline --as-of 2026-11-27
      - name: Import the synthetic Norwegian fixtures
        run: bun run etl:no --source-dir packages/etl/fixtures/no --offline
      - name: Import the synthetic Irish fixtures (places, then the lists)
        run: |
          bun run etl:places --country ie --source-dir packages/etl/fixtures/ie
          bun run etl:ie --source-dir packages/etl/fixtures/ie --offline
      - name: Import the synthetic Finnish fixtures
        run: bun run etl:fi --source-dir packages/etl/fixtures/fi --offline
      - name: Import the synthetic Lithuanian fixtures
        run: bun run etl:lt --source-dir packages/etl/fixtures/lt --offline
      - name: Import the synthetic Slovenian fixtures
        run: bun run etl:si --source-dir packages/etl/fixtures/si --offline
      - name: Import the synthetic Cypriot fixtures
        run: bun run etl:cy --source-dir packages/etl/fixtures/cy --offline
      - name: Import the synthetic Latvian fixtures
        run: bun run etl:lv --source-dir packages/etl/fixtures/lv --offline
      - name: Import the synthetic Swedish fixtures (places, then the lists)
        run: |
          bun run etl:places --country se --source-dir packages/etl/fixtures/se
          bun run etl:se --source-dir packages/etl/fixtures/se --offline
      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium
      # The app the tests (or Lighthouse CI) run against, built after the imports as before.
      - name: Build the web app
        run: bunx turbo run build --filter=@apercura/web
      - name: Playwright (shard ${{ matrix.run }})
        if: matrix.run != 'lighthouse'
        working-directory: apps/web
        run: bun run test:e2e --shard="$SHARD"
        env:
          SHARD: ${{ matrix.run }}
      # Core Web Vitals (mobile emulation), SEO and accessibility scores and JavaScript caps of
      # the home, a practitioner and a listing page, on the same build and fixtures (same origin
      # as APP_URL, so canonical URLs match).
      - name: Lighthouse CI
        if: matrix.run == 'lighthouse'
        working-directory: apps/web
        run: bun run lhci
        env:
          LHCI_PORT: "3100"
      - name: Upload Lighthouse reports
        if: always() && matrix.run == 'lighthouse'
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse
          path: apps/web/.lighthouseci
          # A dot directory: upload-artifact skips hidden files unless told otherwise.
          include-hidden-files: true
          retention-days: 7
      # Merged into one HTML report by the job below.
      - name: Upload the Playwright blob report
        if: ${{ !cancelled() && matrix.run != 'lighthouse' }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ strategy.job-index }}
          path: apps/web/blob-report
          retention-days: 7
      - name: Upload Playwright traces
        if: failure() && matrix.run != 'lighthouse'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: apps/web/test-results
          retention-days: 7

  # The one check to require: passes only when every shard and Lighthouse CI passed (a failed,
  # cancelled or timed-out one fails it), and merges the shards' reports into one.
  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    needs: e2e-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Best effort: the verdict below comes from the shards' results, not from the report.
      - name: Download the shards' blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge them into one HTML report
        id: merge
        if: hashFiles('all-blob-reports/*.zip') != ''
        continue-on-error: true
        working-directory: apps/web
        run: bunx playwright merge-reports --reporter html ../../all-blob-reports
      - name: Upload the Playwright HTML report
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: Every shard and Lighthouse CI passed
        env:
          RESULT: ${{ needs.e2e-shards.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::End-to-end shards or Lighthouse CI: $RESULT (see their jobs, and the playwright-report artifact)"
            exit 1
          fi

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apercura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apercura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/apercura
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
      - name: Re-apply migrations (must be a no-op)
        run: bun run db:migrate
      # Against the migrated schema (skipped by `bun run test` without a database):
      # membership isolation, owner-only procedures, platform admin, rate limits,
      # claims, page ownership and objections, and booking (20 parallel holds on
      # one slot, hold/verify/manage, audited decryption, no plaintext patient
      # data, cross-organization refusals, outbox retries, reminders, purge).
      # Synthetic data only.
      - name: Access-control, claims and booking integration tests
        run: bun run --cwd apps/web test
        env:
          DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/apercura
          SKIP_ENV_VALIDATION: "1"
      # The scheduled jobs start, find the overlap constraint and run on an empty agenda.
      - name: Booking jobs smoke run
        run: bun run jobs:tick
        env:
          SKIP_ENV_VALIDATION: "1"
          APP_URL: http://localhost:3000
      - name: Check schemas and extensions
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tA -c "
            DO \$\$
            BEGIN
              IF (SELECT count(*) FROM pg_extension
                  WHERE extname IN ('postgis', 'pg_trgm', 'unaccent', 'btree_gist')) <> 4 THEN
                RAISE EXCEPTION 'missing extensions';
              END IF;
              IF (SELECT count(*) FROM pg_namespace WHERE nspname IN ('directory', 'care')) <> 2 THEN
                RAISE EXCEPTION 'missing schemas';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM pg_constraint
                  WHERE conname = 'appointments_no_overlap' AND contype = 'x') THEN
                RAISE EXCEPTION 'missing booking overlap constraint';
              END IF;
              IF has_table_privilege('apercura_app', 'care.audit_events', 'UPDATE')
                  OR has_table_privilege('apercura_app', 'care.audit_events', 'DELETE')
                  OR has_schema_privilege('apercura_etl', 'care', 'USAGE') THEN
                RAISE EXCEPTION 'care grants are too wide';
              END IF;
            END
            \$\$;"

  etl:
    name: ETL dry run and integration test (synthetic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apercura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apercura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/apercura
      ETL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/apercura_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Apply migrations
        run: bun run db:migrate
      # Never touches the production database: synthetic fixtures, no network.
      - name: Dry run on the synthetic fixtures
        run: bun run etl:fr --source-dir packages/etl/fixtures/fr --offline --dry-run
      - name: Dry-run the Austrian import on the fixtures
        run: bun run etl:at --source-dir packages/etl/fixtures/at --offline --dry-run
      - name: Dry-run the UK import on the fixtures
        run: bun run etl:gb --source-dir packages/etl/fixtures/gb --offline --dry-run
      - name: Dry-run the Czech import on the fixtures
        run: bun run etl:cz --source-dir packages/etl/fixtures/cz --offline --dry-run
      - name: Dry-run the Spanish import on the fixtures
        run: bun run etl:es --source-dir packages/etl/fixtures/es --offline --dry-run
      - name: Dry-run the Italian import on the fixtures
        run: bun run etl:it --source-dir packages/etl/fixtures/it --offline --dry-run
      - name: Dry-run the German import on the fixtures
        run: bun run etl:de --source-dir packages/etl/fixtures/de --offline --dry-run
      - name: Dry-run the Swiss import on the fixtures
        run: bun run etl:ch --source-dir packages/etl/fixtures/ch --offline --dry-run
      - name: Dry-run the Estonian import on the fixtures
        run: bun run etl:ee --source-dir packages/etl/fixtures/ee --offline --dry-run
      - name: Dry-run the Polish import on the fixtures
        run: bun run etl:pl --source-dir packages/etl/fixtures/pl --offline --dry-run --as-of 2026-11-27
      - name: Dry-run the Norwegian import on the fixtures
        run: bun run etl:no --source-dir packages/etl/fixtures/no --offline --dry-run
      - name: Dry-run the Irish import on the fixtures
        run: |
          bun run etl:places --country ie --source-dir packages/etl/fixtures/ie
          bun run etl:ie --source-dir packages/etl/fixtures/ie --offline --dry-run
      - name: Dry-run the Finnish import on the fixtures
        run: bun run etl:fi --source-dir packages/etl/fixtures/fi --offline --dry-run
      - name: Dry-run the Lithuanian import on the fixtures
        run: bun run etl:lt --source-dir packages/etl/fixtures/lt --offline --dry-run
      - name: Dry-run the Slovenian import on the fixtures
        run: bun run etl:si --source-dir packages/etl/fixtures/si --offline --dry-run
      - name: Dry-run the Cypriot import on the fixtures
        run: bun run etl:cy --source-dir packages/etl/fixtures/cy --offline --dry-run
      - name: Dry-run the Latvian import on the fixtures
        run: bun run etl:lv --source-dir packages/etl/fixtures/lv --offline --dry-run
      - name: Dry-run the Swedish import on the fixtures
        run: |
          bun run etl:places --country se --source-dir packages/etl/fixtures/se
          bun run etl:se --source-dir packages/etl/fixtures/se --offline --dry-run
      - name: Integration test (import twice, guards, removals, suppressions)
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE apercura_test"
          DATABASE_URL="$ETL_TEST_DATABASE_URL" bun run db:migrate
          bun run --cwd packages/etl test

  docker:
    name: Docker image and self-hosting smoke test (synthetic fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Builds docker/Dockerfile (no push), starts docker/compose.selfhost.yml from a clean
      # state with throwaway secrets, imports the SYNTHETIC fixtures, checks the home page, a
      # practitioner page, /api/health, jobs:tick and the import role's grants, then removes
      # everything (volumes included).
      - name: Build and smoke test (self-hosted stack)
        run: docker/smoke-test.sh selfhost
      # The same image, docker/compose.app.yml alone against a PostGIS and a MinIO started
      # apart, fresh and without the init script (the Coolify layout): migrate waits for the
      # database, the migrations create the roles and migrate gives them their logins.
      - name: Smoke test (application stack, external database and S3)
        run: docker/smoke-test.sh external
        env:
          SMOKE_BUILD: "0"
